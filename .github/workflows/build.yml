name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - name: Debug - list files before
        run: ls -la && echo "---" && cat pubspec.yaml | head -5

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --overwrite . 2>&1
          echo "CREATE_EXIT=$?"
          echo "--- android dir ---"
          ls -la android/ 2>&1
          echo "--- app/src ---"
          ls -R android/app/src 2>&1 | head -20

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pure-reader-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
